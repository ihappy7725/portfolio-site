<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정주연 Juyeon Jung | Portfolio</title>
  <meta name="description" content="국제 통상 이슈를 탐구하고, AI와 협업하여 도구로 만듭니다. 정주연(Juyeon Jung)의 포트폴리오." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 화면의 모든 문구는 js/content.js 에서 관리합니다. 이 파일은 뼈대만 담고 있습니다. -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="header-name" id="header-name" href="#top"></a>
      <nav class="site-nav" id="site-nav" aria-label="Main"></nav>
      <div class="header-tools">
        <div class="lang-switch" id="lang-switch" role="group" aria-label="Language"></div>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="container hero-inner">
        <div class="hero-text">
          <p class="eyebrow" id="hero-eyebrow"></p>
          <h1 id="hero-name"></h1>
          <p class="headline" id="hero-headline"></p>
          <p class="hero-intro" id="hero-intro"></p>
          <div class="hero-interests" id="hero-interests"></div>
        </div>
      </div>
      <div class="container">
        <h2 class="strengths-title" id="strengths-title"></h2>
        <div class="strengths" id="strengths"></div>
      </div>
    </section>

    <section class="section" id="about"></section>
    <section class="section section-alt" id="experience"></section>
    <section class="section" id="projects"></section>
    <section class="section section-alt" id="now"></section>
    <section class="section" id="notes" hidden></section>
    <section class="section" id="contact"></section>
  </main>

  <footer class="site-footer">
    <div class="container" id="footer"></div>
  </footer>

  <noscript><p class="noscript">이 사이트는 JavaScript를 사용합니다. / This site requires JavaScript.</p></noscript>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
